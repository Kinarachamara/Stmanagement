const STORAGE_KEY = "al2027_progress";
const THEME_KEY = "al2027_theme";

let currentSubjectId = null;
let filteredSubjectIds = null;

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}
function saveProgress(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function resourceClass(type) {
  if (type === "video") return "video";
  if (type === "pdf") return "pdf";
  if (type === "drive") return "drive";
  if (type === "pending") return "pending";
  return "other";
}
function resourceIcon(type) {
  if (type === "video") return "▶";
  if (type === "pdf") return "📄";
  if (type === "drive") return "📁";
  if (type === "pending") return "⏳";
  return "🔗";
}
function resourceSubText(type) {
  if (type === "video") return "Watch recording";
  if (type === "pdf") return "Open PDF";
  if (type === "drive") return "Open files";
  if (type === "pending") return "Coming soon";
  return "Open resource";
}

function getSubjectProgress(subject) {
  const progress = loadProgress();
  let total = 0, done = 0;
  subject.cards.forEach(card => {
    (card.items || []).forEach(item => {
      total++;
      if (progress[item.id]) done++;
    });
  });
  return { total, done };
}

function hideAllPages() {
  ["homePage", "subjectPage", "itemPage"].forEach(id => {
    document.getElementById(id).classList.remove("active");
  });
}

function getVisibleSubjects() {
  if (!classData) return [];
  if (!filteredSubjectIds || filteredSubjectIds.length === 0) return classData;
  return classData.filter(s => filteredSubjectIds.includes(s.id));
}

function renderFilterBanner() {
  const banner = document.getElementById("filterBanner");
  if (!filteredSubjectIds || filteredSubjectIds.length === 0) {
    banner.style.display = "none";
    banner.innerHTML = "";
    return;
  }
  const names = filteredSubjectIds.map(id => {
    const s = classData.find(x => x.id === id);
    return s ? s.title : id;
  }).join(", ");
  banner.style.display = "block";
  banner.innerHTML = `
    <div class="filter-banner">
      <span>Showing: <strong>${names}</strong></span>
      <button class="filter-clear" onclick="clearFilter()">Show all</button>
    </div>
  `;
}

function renderHome() {
  const grid = document.getElementById("subjectGrid");
  const subjects = getVisibleSubjects();
  renderFilterBanner();

  if (!subjects.length) {
    grid.innerHTML = `<div class="empty">No classes available.</div>`;
    return;
  }
  grid.innerHTML = subjects.map((subject) => {
    const index = classData.findIndex(s => s.id === subject.id);
    const { total, done } = getSubjectProgress(subject);
    const pillClass = total > 0 && done === total ? "done" : "";
    const pillText = total === 0 ? "No items" : `${done}/${total} done`;
    return `
      <div class="subject-card" onclick="openSubject(${index})" style="--card-accent:${subject.color}">
        <div class="subject-icon" style="background:${subject.color}22;color:${subject.color}">
          ${subject.icon}
        </div>
        <h2>${subject.title}</h2>
        <p>${subject.badge || "2027 A/L"}</p>
        <div class="subject-meta">
          <span class="progress-pill ${pillClass}">${pillText}</span>
          <span class="subject-arrow">→</span>
        </div>
      </div>
    `;
  }).join("");
}

function openSubject(index, fromHash = false) {
  const subject = classData[index];
  if (!subject) return;

  currentSubjectId = subject.id;
  hideAllPages();
  document.getElementById("subjectPage").classList.add("active");
  document.getElementById("subjectTitle").innerHTML = `${subject.icon} ${subject.title}`;
  document.getElementById("subjectDescription").textContent =
    `${subject.badge || "2027 A/L"} • Recordings & Resources`;

  renderRecordings(subject);

  if (!fromHash) {
    const filterPart = filteredSubjectIds?.length
      ? `?subjects=${filteredSubjectIds.join(",")}`
      : "";
    history.replaceState(null, "", `${filterPart}#${subject.id}`);
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function openSingleItem(subjectId, itemId, fromHash = false) {
  const subject = classData.find(s => s.id === subjectId);
  if (!subject) return;

  let item = null;
  subject.cards.forEach(card => {
    (card.items || []).forEach(i => { if (i.id === itemId) item = i; });
  });
  if (!item) return;

  currentSubjectId = subjectId;
  hideAllPages();
  document.getElementById("itemPage").classList.add("active");

  document.getElementById("itemPageTitle").textContent = item.title;
  document.getElementById("itemPageDesc").textContent = `${subject.icon} ${subject.title}`;

  const progress = loadProgress();
  const isDone = !!progress[item.id];
  const accent = subject.color || "#3b82f6";

  const resourcesHtml = (item.links || []).map(link => {
    const cls = resourceClass(link.type);
    const icon = resourceIcon(link.type);
    const sub = resourceSubText(link.type);
    if (link.type === "pending") {
      return `
        <div class="resource ${cls}">
          <div class="resource-icon">${icon}</div>
          <div class="resource-text">
            <strong>${link.label}</strong>
            <span>${sub}</span>
          </div>
        </div>`;
    }
    return `
      <a class="resource ${cls}" href="${link.url}" target="_blank" rel="noopener noreferrer">
        <div class="resource-icon">${icon}</div>
        <div class="resource-text">
          <strong>${link.label}</strong>
          <span>${sub}</span>
        </div>
      </a>`;
  }).join("");

  document.getElementById("singleItemContent").innerHTML = `
    <div class="single-wrap">
      <div class="single-top ${isDone ? "completed" : ""}" style="--accent-color:${accent}">
        <div class="single-top-inner">
          <div class="single-num">${item.num || "•"}</div>
          <div class="single-meta">
            <h3>${item.title}</h3>
            <p>${subject.badge || "2027 A/L"}</p>
          </div>
        </div>
      </div>
      <div class="single-resources">
        ${resourcesHtml || `<div class="empty">No resources available.</div>`}
      </div>
    </div>
    <div class="single-check-row">
      <input type="checkbox" id="singleCheck" ${isDone ? "checked" : ""}
             onchange="toggleProgress('${item.id}', this)">
      <label for="singleCheck">Mark as completed</label>
    </div>
  `;

  if (!fromHash) {
    const filterPart = filteredSubjectIds?.length
      ? `?subjects=${filteredSubjectIds.join(",")}`
      : "";
    history.replaceState(null, "", `${filterPart}#${subjectId}/${itemId}`);
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function goHome() {
  hideAllPages();
  document.getElementById("homePage").classList.add("active");
  currentSubjectId = null;
  const filterPart = filteredSubjectIds?.length
    ? `?subjects=${filteredSubjectIds.join(",")}`
    : "";
  history.replaceState(null, "", filterPart || window.location.pathname);
  renderHome();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function clearFilter() {
  filteredSubjectIds = null;
  const hash = window.location.hash;
  history.replaceState(null, "", window.location.pathname + hash);
  if (document.getElementById("homePage").classList.contains("active")) {
    renderHome();
  } else {
    goHome();
  }
}

function renderRecordings(subject) {
  const container = document.getElementById("recordingList");
  const progress = loadProgress();
  let html = "";

  subject.cards.forEach(card => {
    if (!card.items?.length) return;
    card.items.forEach((item, index) => {
      const done = progress[item.id] ? "completed" : "";
      const resources = (item.links || []).map(link => {
        const cls = resourceClass(link.type);
        const icon = resourceIcon(link.type);
        const sub = resourceSubText(link.type);
        if (link.type === "pending") {
          return `
            <div class="resource ${cls}">
              <div class="resource-icon">${icon}</div>
              <div class="resource-text">
                <strong>${link.label}</strong>
                <span>${sub}</span>
              </div>
            </div>`;
        }
        return `
          <a class="resource ${cls}" href="${link.url}" target="_blank" rel="noopener noreferrer">
            <div class="resource-icon">${icon}</div>
            <div class="resource-text">
              <strong>${link.label}</strong>
              <span>${sub}</span>
            </div>
          </a>`;
      }).join("");

      html += `
        <div class="recording ${done}" data-id="${item.id}">
          <div class="recording-main" onclick="toggleRecording(this)">
            <div class="recording-number">${item.num || String(index + 1).padStart(2, "0")}</div>
            <div class="recording-info">
              <h3>${item.title}</h3>
              <p>${(item.links?.length) ? "Tap to view resources" : "No resources yet"}</p>
            </div>
            <div class="progress-row">
              <input type="checkbox" class="progress-check" ${done ? "checked" : ""}
                     onclick="event.stopPropagation()"
                     onchange="toggleProgress('${item.id}', this)">
              <span class="chevron">›</span>
            </div>
          </div>
          <div class="resources">
            ${resources || `<div class="empty">No resources available.</div>`}
          </div>
        </div>`;
    });
  });

  container.innerHTML = html || `<div class="empty">No recordings available.</div>`;
}

function toggleRecording(el) {
  el.closest(".recording").classList.toggle("open");
}

function toggleProgress(id, checkbox) {
  const progress = loadProgress();
  if (checkbox.checked) progress[id] = true;
  else delete progress[id];
  saveProgress(progress);

  const rec = document.querySelector(`.recording[data-id="${id}"]`);
  if (rec) {
    rec.classList.toggle("completed", checkbox.checked);
  }

  const singleTop = document.querySelector(".single-top");
  if (singleTop) {
    singleTop.classList.toggle("completed", checkbox.checked);
  }

  if (document.getElementById("homePage").classList.contains("active")) {
    renderHome();
  }
}

function parseUrlState() {
  const params = new URLSearchParams(window.location.search);
  const subjectsParam = params.get("subjects");
  if (subjectsParam) {
    filteredSubjectIds = subjectsParam.split(",").map(s => s.trim()).filter(Boolean);
  } else {
    filteredSubjectIds = null;
  }
}

function handleHash() {
  parseUrlState();
  const hash = window.location.hash.slice(1);

  if (!hash || !classData) {
    goHome();
    return;
  }

  const [subjectId, itemId] = hash.split("/");
  const index = classData.findIndex(s => s.id === subjectId);

  if (index === -1) {
    goHome();
    return;
  }

  if (itemId) {
    openSingleItem(subjectId, itemId, true);
  } else {
    openSubject(index, true);
  }
}

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  html.setAttribute("data-theme", next === "dark" ? "dark" : "");
  localStorage.setItem(THEME_KEY, next);
  document.querySelector(".theme-btn").textContent = next === "dark" ? "☀️" : "🌙";
}

function initTheme() {
  const saved = localStorage.getItem(THEME_KEY) || "light";
  if (saved === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
    document.querySelector(".theme-btn").textContent = "☀️";
  }
}

document.addEventListener("DOMContentLoaded", () => {
  initTheme();
  if (typeof classData === "undefined") {
    document.getElementById("subjectGrid").innerHTML = `<div class="empty">data.js not loaded. Please check the file.</div>`;
    return;
  }
  parseUrlState();
  renderHome();
  handleHash();
});

window.addEventListener("hashchange", handleHash);
window.addEventListener("popstate", () => {
  parseUrlState();
  handleHash();
});
</script>
</body>
</html>
