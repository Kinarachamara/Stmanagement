<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>පිටුව සොයාගත නොහැක - 404 Error</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .error-code {
            font-size: 120px;
            font-weight: 800;
            color: #ff4757;
            line-height: 1;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #2f3542;
        }

        p {
            font-size: 16px;
            color: #747d8c;
            margin-bottom: 30px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        .home-button {
            display: inline-block;
            padding: 12px 25px;
            background-color: #2ed573;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        .home-button:hover {
            background-color: #26af5f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="error-code">404</h1>
        <h2>අපොයි! පිටුව සොයාගත නොහැක</h2>
        <p>ඔබ සොයන පිටුව ඉවත් කර ඇත, එහි නම වෙනස් කර ඇත හෝ තාවකාලිකව අක්‍රිය කර ඇත.</p>
        <a href="/" class="home-button">මුල් පිටුවට යන්න</a>
    </div>
</body>
</html>
