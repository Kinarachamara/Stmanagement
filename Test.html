<style>

  --blue-soft: #eff6ff;

  --green-soft: #ecfdf5;
  --red: #ef4444;
  --red-soft: #fef2f2;
  --purple: #8b5cf6;
  --purple-soft: #f5f3ff;
  --orange: #f59e0b;
  --radius: 20px;
  --shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 12px 36px rgba(15, 23, 42, 0.08);
  --header-bg: linear-gradient(155deg, #0f172a 0%, #1e293b 40%, #1e3a5f 100%);
  --accent-glow: rgba(59, 130, 246, 0.12);
}
[data-theme="dark"] {
  --bg: #0b1120;
  --card: #1e293b;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --border: #334155;
  --blue-soft: #1e3a5f;
  --green-soft: #064e3b;
  --red-soft: #450a0a;
  --purple-soft: #2e1065;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.45);
  --header-bg: linear-gradient(155deg, #020617 0%, #0f172a 50%, #1e293b 100%);
  --accent-glow: rgba(96, 165, 250, 0.1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background 0.3s ease, color 0.3s ease;
}
header {
  background: var(--header-bg);
  color: white;
  padding: 36px 20px 58px;
  position: relative;
  overflow: hidden;
}
header::before {
  content: "";
  position: absolute;
  top: -40%;
  right: -10%;
  width: 420px;
  height: 420px;
  background: radial-gradient(circle, rgba(59,130,246,0.18) 0%, transparent 70%);
  pointer-events: none;
}
header::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.22));
  pointer-events: none;
}
.header-inner {
  max-width: 980px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.header-left { flex: 1; }
.logo {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
  color: #93c5fd;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(147, 197, 253, 0.12);
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid rgba(147, 197, 253, 0.22);
}
header h1 {
  margin-top: 16px;
  font-size: clamp(26px, 5.2vw, 40px);
  font-weight: 800;
  letter-spacing: -0.045em;
  line-height: 1.15;
  background: linear-gradient(135deg, #ffffff 25%, #bfdbfe 100%);

  -webkit-text-fill-color: transparent;
  background-clip: text;
}
header p {
  margin-top: 8px;
  color: #94a3b8;
  font-size: 14px;
  font-weight: 500;
}
.theme-btn {
  border: none;
  background: rgba(255,255,255,0.1);
  width: 42px;
  height: 42px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 18px;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  border: 1px solid rgba(255,255,255,0.15);
}
.theme-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }

main {
  max-width: 980px;
  margin: -32px auto 0;
  padding: 0 16px 60px;
  position: relative;
  z-index: 2;
}
.page {
  display: none;
  animation: fadeUp 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
.page.active { display: block; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== SUBJECT GRID ===== */
.subject-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.subject-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 22px 20px;
  cursor: pointer;
  transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.subject-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-lg);
  border-color: color-mix(in srgb, var(--card-accent, #3b82f6) 35%, var(--border));
}
.subject-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--card-accent, #3b82f6), transparent);
  opacity: 0;
  transition: opacity 0.25s;
}
.subject-card:hover::before { opacity: 1; }
.subject-icon {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  margin-bottom: 16px;
  box-shadow: 0 4px 12px var(--accent-glow);
}
.subject-card h2 {
  font-size: 16.5px;
  font-weight: 700;
  margin-bottom: 5px;
  line-height: 1.3;
  letter-spacing: -0.02em;
}
.subject-card p {
  font-size: 12.5px;
  color: var(--muted);
  font-weight: 500;
}
.subject-meta {
  margin-top: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.progress-pill {
  font-size: 11px;
  font-weight: 700;
  padding: 5px 11px;
  border-radius: 999px;
  background: var(--bg);
  color: var(--muted);
}
.progress-pill.done {
  background: var(--green-soft);
  color: #059669;
}
.subject-arrow {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: var(--bg);
  color: var(--blue);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 15px;
  transition: all 0.25s;
}
.subject-card:hover .subject-arrow {
  background: var(--blue);
  color: white;
  transform: translateX(3px);
}

/* ===== PAGE HEADER ===== */
.page-header {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 12px 14px;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: var(--shadow);
}
.back-btn {
  border: none;
  background: var(--bg);
  width: 42px;
  height: 42px;
  border-radius: 13px;
  cursor: pointer;
  font-size: 18px;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  flex-shrink: 0;
}
.back-btn:hover {
  background: var(--border);
  transform: translateX(-2px);
}
.page-title { flex: 1; min-width: 0; }
.page-title h2 {
  font-size: 17.5px;
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: -0.02em;
}
.page-title p {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 3px;
  font-weight: 500;
}

/* ===== RECORDINGS LIST ===== */
.recording-list { display: grid; gap: 12px; }
.recording {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: all 0.25s ease;
  box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
}
.recording:hover {
  box-shadow: var(--shadow-lg);
  border-color: rgba(59, 130, 246, 0.28);
}
.recording-main {
  padding: 15px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  user-select: none;
}
.recording-number {
  min-width: 42px;
  height: 42px;
  border-radius: 13px;
  background: var(--blue-soft);
  color: var(--blue);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
  flex-shrink: 0;
}
.recording.completed .recording-number {
  background: var(--green-soft);
  color: #059669;
}
.recording-info { flex: 1; min-width: 0; }
.recording-info h3 {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -0.015em;
}
.recording.completed .recording-info h3 {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-thickness: 1.5px;
}
.recording-info p {
  margin-top: 3px;
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 500;
}
.progress-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.progress-check {
  width: 19px;
  height: 19px;
  accent-color: var(--green);
  cursor: pointer;
}
.chevron {
  font-size: 22px;
  color: var(--muted);
  transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  line-height: 1;
  font-weight: 300;
}
.recording.open .chevron {
  transform: rotate(90deg);
  color: var(--blue);
}
.resources {
  display: none;
  border-top: 1px solid var(--border);
  background: var(--bg);
  padding: 14px;
  gap: 10px;
}
.recording.open .resources {
  display: grid;
  grid-template-columns: 1fr;
  animation: slideDown 0.3s ease;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== RESOURCE CARDS ===== */
.resource {
  text-decoration: none;
  border-radius: 14px;
  padding: 13px 15px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid transparent;
  transition: all 0.2s ease;
  font-weight: 600;
}
.resource:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.07);
}
.resource-icon {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.resource-text strong {
  display: block;
  font-size: 13.5px;
  font-weight: 700;
}
.resource-text span {
  display: block;
  font-size: 11.5px;
  margin-top: 2px;
  opacity: 0.75;
  font-weight: 500;
}
.resource.video { background: var(--red-soft); color: #dc2626; border-color: #fecaca; }
.resource.video .resource-icon { background: #fee2e2; }
.resource.pdf { background: var(--blue-soft); color: #2563eb; border-color: #bfdbfe; }
.resource.pdf .resource-icon { background: #dbeafe; }
.resource.drive { background: var(--green-soft); color: #059669; border-color: #a7f3d0; }
.resource.drive .resource-icon { background: #d1fae5; }
.resource.other { background: var(--purple-soft); color: #7c3aed; border-color: #ddd6fe; }
.resource.other .resource-icon { background: #ede9fe; }
.resource.pending {
  background: var(--bg);
  color: var(--muted);
  border-color: var(--border);
  cursor: default;
}
.resource.pending:hover { transform: none; box-shadow: none; }
.resource.pending .resource-icon { background: var(--border); }

/* ===== SINGLE ITEM PAGE ===== */
.single-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.single-top {
  padding: 28px 22px 24px;
  position: relative;
  overflow: hidden;
}
.single-top::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent-color, #3b82f6) 18%, transparent), transparent 65%);
  opacity: 0.7;
}
.single-top-inner {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 18px;
}
.single-num {
  min-width: 64px;
  height: 64px;
  border-radius: 18px;
  background: var(--card);
  color: var(--accent-color, #3b82f6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 800;
  box-shadow: 0 8px 20px rgba(0,0,0,0.07);
  border: 1px solid var(--border);
}
.single-top.completed .single-num {
  background: var(--green-soft);
  color: #059669;
}
.single-meta h3 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.25;
}
.single-meta p {
  margin-top: 6px;
  font-size: 14px;
  color: var(--muted);
  font-weight: 500;
}
.single-resources {
  padding: 18px;
  display: grid;
  gap: 12px;
  background: var(--bg);
}
.single-check-row {
  margin-top: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 18px;
  background: var(--card);
  border-radius: 16px;
  border: 1px solid var(--border);
  font-size: 14.5px;
  font-weight: 600;
  box-shadow: var(--shadow);
}
.single-check-row input {
  width: 22px;
  height: 22px;
  accent-color: var(--green);
  cursor: pointer;
}

.empty {
  background: var(--card);
  border: 1.5px dashed var(--border);
  border-radius: 18px;
  padding: 42px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 500;
}

/* ===== FREE CLASSES DASHBOARD ===== */
.free-dashboard {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.free-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px 16px;
  text-decoration: none;
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
  transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  cursor: pointer;
}
.free-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-lg);
  border-color: color-mix(in srgb, #22c55e 40%, var(--border));
}
.free-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, #22c55e, transparent);
  opacity: 0;
  transition: opacity 0.25s;
}
.free-card:hover::before { opacity: 1; }
.free-card-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: linear-gradient(135deg, #22c55e22, #16a34a18);
  color: #16a34a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 4px 12px rgba(34, 197, 94, 0.15);
}
.free-card-num {
  position: absolute;
  top: 14px;
  right: 14px;
  font-size: 11px;
  font-weight: 800;
  color: #16a34a;
  background: #dcfce7;
  padding: 4px 10px;
  border-radius: 999px;
}
[data-theme="dark"] .free-card-num {
  background: #14532d;
  color: #86efac;
}
.free-card h3 {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -0.02em;
  margin-top: 2px;
}
.free-card-meta {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  color: #16a34a;
}
.free-card-meta span.play {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: #dcfce7;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  transition: all 0.2s;
}
[data-theme="dark"] .free-card-meta span.play {
  background: #14532d;
}
.free-card:hover .free-card-meta span.play {
  background: #16a34a;
  color: white;
}
.free-header-banner {
  background: linear-gradient(135deg, #16a34a 0%, #22c55e 50%, #4ade80 100%);
  border-radius: 18px;
  padding: 18px 20px;
  margin-bottom: 18px;
  color: white;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 8px 24px rgba(34, 197, 94, 0.25);
}
.free-header-banner .banner-icon {
  width: 48px;
  height: 48px;
  background: rgba(255,255,255,0.2);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}
.free-header-banner h3 {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.free-header-banner p {
  font-size: 12.5px;
  opacity: 0.9;
  margin-top: 3px;
  font-weight: 500;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 11.5px;
  padding: 10px 16px 36px;
  font-weight: 500;
}

@media (min-width: 700px) {
  .free-dashboard {
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .subject-grid {
    grid-template-columns: repeat(3, 1fr);

  }

@media (max-width: 480px) {

}
