<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ET • ICT • SFT Classes 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f4f8;
  --card: #ffffff;
  --text: #1e293b;
  --muted: #64748b;
  --border: #e2e8f0;
  --blue: #3b82f6;
  --blue-soft: #eff6ff;
  --green: #10b981;
  --green-soft: #ecfdf5;
  --red: #ef4444;
  --red-soft: #fef2f2;
  --purple: #8b5cf6;
  --purple-soft: #f5f3ff;
  --orange: #f59e0b;
  --radius: 20px;
  --shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 12px 36px rgba(15, 23, 42, 0.08);
  --header-bg: linear-gradient(155deg, #0f172a 0%, #1e293b 40%, #1e3a5f 100%);
  --accent-glow: rgba(59, 130, 246, 0.12);
}
[data-theme="dark"] {
  --bg: #0b1120;
  --card: #1e293b;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --border: #334155;
  --blue-soft: #1e3a5f;
  --green-soft: #064e3b;
  --red-soft: #450a0a;
  --purple-soft: #2e1065;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.45);
  --header-bg: linear-gradient(155deg, #020617 0%, #0f172a 50%, #1e293b 100%);
  --accent-glow: rgba(96, 165, 250, 0.1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background 0.3s ease, color 0.3s ease;
}
header {
  background: var(--header-bg);
  color: white;
  padding: 36px 20px 58px;
  position: relative;
  overflow: hidden;
}
header::before {
  content: "";
  position: absolute;
  top: -40%;
  right: -10%;
  width: 420px;
  height: 420px;
  background: radial-gradient(circle, rgba(59,130,246,0.18) 0%, transparent 70%);
  pointer-events: none;
}
header::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.22));
  pointer-events: none;
}
.header-inner {
  max-width: 980px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.header-left { flex: 1; }
.logo {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
  color: #93c5fd;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(147, 197, 253, 0.12);
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid rgba(147, 197, 253, 0.22);
}
header h1 {
  margin-top: 16px;
  font-size: clamp(26px, 5.2vw, 40px);
  font-weight: 800;
  letter-spacing: -0.045em;
  line-height: 1.15;
  background: linear-gradient(135deg, #ffffff 25%, #bfdbfe 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
header p {
  margin-top: 8px;
  color: #94a3b8;
  font-size: 14px;
  font-weight: 500;
}
.theme-btn {
  border: none;
  background: rgba(255,255,255,0.1);
  width: 42px;
  height: 42px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 18px;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  border: 1px solid rgba(255,255,255,0.15);
}
.theme-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }

main {
  max-width: 980px;
  margin: -32px auto 0;
  padding: 0 16px 60px;
  position: relative;
  z-index: 2;
}
.page {
  display: none;
  animation: fadeUp 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
.page.active { display: block; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== SUBJECT GRID ===== */
.subject-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.subject-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 22px 20px;
  cursor: pointer;
  transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.subject-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-lg);
  border-color: color-mix(in srgb, var(--card-accent, #3b82f6) 35%, var(--border));
}
.subject-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--card-accent, #3b82f6), transparent);
  opacity: 0;
  transition: opacity 0.25s;
}
.subject-card:hover::before { opacity: 1; }
.subject-icon {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  margin-bottom: 16px;
  box-shadow: 0 4px 12px var(--accent-glow);
}
.subject-card h2 {
  font-size: 16.5px;
  font-weight: 700;
  margin-bottom: 5px;
  line-height: 1.3;
  letter-spacing: -0.02em;
}
.subject-card p {
  font-size: 12.5px;
  color: var(--muted);
  font-weight: 500;
}
.subject-meta {
  margin-top: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.progress-pill {
  font-size: 11px;
  font-weight: 700;
  padding: 5px 11px;
  border-radius: 999px;
  background: var(--bg);
  color: var(--muted);
}
.progress-pill.done {
  background: var(--green-soft);
  color: #059669;
}
.subject-arrow {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: var(--bg);
  color: var(--blue);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 15px;
  transition: all 0.25s;
}
.subject-card:hover .subject-arrow {
  background: var(--blue);
  color: white;
  transform: translateX(3px);
}

/* ===== PAGE HEADER ===== */
.page-header {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 12px 14px;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: var(--shadow);
}
.back-btn {
  border: none;
  background: var(--bg);
  width: 42px;
  height: 42px;
  border-radius: 13px;
  cursor: pointer;
  font-size: 18px;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  flex-shrink: 0;
}
.back-btn:hover {
  background: var(--border);
  transform: translateX(-2px);
}
.page-title { flex: 1; min-width: 0; }
.page-title h2 {
  font-size: 17.5px;
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: -0.02em;
}
.page-title p {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 3px;
  font-weight: 500;
}

/* ===== RECORDINGS LIST ===== */
.recording-list { display: grid; gap: 12px; }
.recording {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: all 0.25s ease;
  box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
}
.recording:hover {
  box-shadow: var(--shadow-lg);
  border-color: rgba(59, 130, 246, 0.28);
}
.recording-main {
  padding: 15px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  user-select: none;
}
.recording-number {
  min-width: 42px;
  height: 42px;
  border-radius: 13px;
  background: var(--blue-soft);
  color: var(--blue);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
  flex-shrink: 0;
}
.recording.completed .recording-number {
  background: var(--green-soft);
  color: #059669;
}
.recording-info { flex: 1; min-width: 0; }
.recording-info h3 {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -0.015em;
}
.recording.completed .recording-info h3 {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-thickness: 1.5px;
}
.recording-info p {
  margin-top: 3px;
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 500;
}
.progress-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.progress-check {
  width: 19px;
  height: 19px;
  accent-color: var(--green);
  cursor: pointer;
}
.chevron {
  font-size: 22px;
  color: var(--muted);
  transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  line-height: 1;
  font-weight: 300;
}
.recording.open .chevron {
  transform: rotate(90deg);
  color: var(--blue);
}
.resources {
  display: none;
  border-top: 1px solid var(--border);
  background: var(--bg);
  padding: 14px;
  gap: 10px;
}
.recording.open .resources {
  display: grid;
  grid-template-columns: 1fr;
  animation: slideDown 0.3s ease;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== RESOURCE CARDS ===== */
.resource {
  text-decoration: none;
  border-radius: 14px;
  padding: 13px 15px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid transparent;
  transition: all 0.2s ease;
  font-weight: 600;
}
.resource:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.07);
}
.resource-icon {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.resource-text strong {
  display: block;
  font-size: 13.5px;
  font-weight: 700;
}
.resource-text span {
  display: block;
  font-size: 11.5px;
  margin-top: 2px;
  opacity: 0.75;
  font-weight: 500;
}
.resource.video { background: var(--red-soft); color: #dc2626; border-color: #fecaca; }
.resource.video .resource-icon { background: #fee2e2; }
.resource.pdf { background: var(--blue-soft); color: #2563eb; border-color: #bfdbfe; }
.resource.pdf .resource-icon { background: #dbeafe; }
.resource.drive { background: var(--green-soft); color: #059669; border-color: #a7f3d0; }
.resource.drive .resource-icon { background: #d1fae5; }
.resource.other { background: var(--purple-soft); color: #7c3aed; border-color: #ddd6fe; }
.resource.other .resource-icon { background: #ede9fe; }
.resource.pending {
  background: var(--bg);
  color: var(--muted);
  border-color: var(--border);
  cursor: default;
}
.resource.pending:hover { transform: none; box-shadow: none; }
.resource.pending .resource-icon { background: var(--border); }

/* ===== SINGLE ITEM PAGE ===== */
.single-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.single-top {
  padding: 28px 22px 24px;
  position: relative;
  overflow: hidden;
}
.single-top::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent-color, #3b82f6) 18%, transparent), transparent 65%);
  opacity: 0.7;
}
.single-top-inner {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 18px;
}
.single-num {
  min-width: 64px;
  height: 64px;
  border-radius: 18px;
  background: var(--card);
  color: var(--accent-color, #3b82f6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 800;
  box-shadow: 0 8px 20px rgba(0,0,0,0.07);
  border: 1px solid var(--border);
}
.single-top.completed .single-num {
  background: var(--green-soft);
  color: #059669;
}
.single-meta h3 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.25;
}
.single-meta p {
  margin-top: 6px;
  font-size: 14px;
  color: var(--muted);
  font-weight: 500;
}
.single-resources {
  padding: 18px;
  display: grid;
  gap: 12px;
  background: var(--bg);
}
.single-check-row {
  margin-top: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 18px;
  background: var(--card);
  border-radius: 16px;
  border: 1px solid var(--border);
  font-size: 14.5px;
  font-weight: 600;
  box-shadow: var(--shadow);
}
.single-check-row input {
  width: 22px;
  height: 22px;
  accent-color: var(--green);
  cursor: pointer;
}

.empty {
  background: var(--card);
  border: 1.5px dashed var(--border);
  border-radius: 18px;
  padding: 42px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 500;
}
footer {
  text-align: center;
  color: var(--muted);
  font-size: 11.5px;
  padding: 10px 16px 36px;
  font-weight: 500;
}

@media (min-width: 700px) {
  .subject-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .recording.open .resources,
  .single-resources {
    grid-template-columns: repeat(2, 1fr);
  }
  .page-title h2 { font-size: 19px; }
  .single-meta h3 { font-size: 26px; }
}
@media (max-width: 480px) {
  header { padding: 28px 16px 50px; }
  .subject-card { padding: 18px 16px; }
  .subject-icon { width: 46px; height: 46px; font-size: 21px; margin-bottom: 13px; }
  .recording-main { padding: 13px 12px; gap: 11px; }
  .recording-number { min-width: 38px; height: 38px; font-size: 12px; }
  .single-num { min-width: 54px; height: 54px; font-size: 17px; }
  .single-meta h3 { font-size: 19px; }
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="header-left">
      <div class="logo">2027 A/L • TECHNOLOGY</div>
      <h1>ET • ICT • SFT Classes</h1>
      <p>Revision • Recordings • Papers • Resources</p>
    </div>
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
  </div>
</header>

<main>
  <!-- HOME -->
  <section id="homePage" class="page active">
    <div class="subject-grid" id="subjectGrid"></div>
  </section>

  <!-- SUBJECT LIST -->
  <section id="subjectPage" class="page">
    <div class="page-header">
      <div class="page-title">
        <h2 id="subjectTitle"></h2>
        <p id="subjectDescription"></p>
      </div>
    </div>
    <div class="recording-list" id="recordingList"></div>
  </section>

  <!-- SINGLE ITEM -->
  <section id="itemPage" class="page">
    <div class="page-header">
      <div class="page-title">
        <h2 id="itemPageTitle"></h2>
        <p id="itemPageDesc"></p>
      </div>
    </div>
    <div id="singleItemContent"></div>
  </section>
</main>

<footer>2027 A/L Students • Progress automatically saved</footer>

<script src="data.js"></script>
<script>
const STORAGE_KEY = "al2027_progress";
const THEME_KEY = "al2027_theme";

let currentSubjectId = null;

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}
function saveProgress(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function resourceClass(type) {
  if (type === "video") return "video";
  if (type === "pdf") return "pdf";
  if (type === "drive") return "drive";
  if (type === "pending") return "pending";
  return "other";
}
function resourceIcon(type) {
  if (type === "video") return "▶";
  if (type === "pdf") return "📄";
  if (type === "drive") return "📁";
  if (type === "pending") return "⏳";
  return "🔗";
}
function resourceSubText(type) {
  if (type === "video") return "Watch recording";
  if (type === "pdf") return "Open PDF";
  if (type === "drive") return "Open files";
  if (type === "pending") return "Coming soon";
  return "Open resource";
}

function getSubjectProgress(subject) {
  const progress = loadProgress();
  let total = 0, done = 0;
  subject.cards.forEach(card => {
    (card.items || []).forEach(item => {
      total++;
      if (progress[item.id]) done++;
    });
  });
  return { total, done };
}

function hideAllPages() {
  ["homePage", "subjectPage", "itemPage"].forEach(id => {
    document.getElementById(id).classList.remove("active");
  });
}

function renderHome() {
  const grid = document.getElementById("subjectGrid");
  if (!classData?.length) {
    grid.innerHTML = `<div class="empty">No classes available.</div>`;
    return;
  }
  grid.innerHTML = classData.map((subject, index) => {
    const { total, done } = getSubjectProgress(subject);
    const pillClass = total > 0 && done === total ? "done" : "";
    const pillText = total === 0 ? "No items" : `${done}/${total} done`;
    return `
      <div class="subject-card" onclick="openSubject(${index})" style="--card-accent:${subject.color}">
        <div class="subject-icon" style="background:${subject.color}22;color:${subject.color}">
          ${subject.icon}
        </div>
        <h2>${subject.title}</h2>
        <p>${subject.badge || "2027 A/L"}</p>
        <div class="subject-meta">
          <span class="progress-pill ${pillClass}">${pillText}</span>
          <span class="subject-arrow">→</span>
        </div>
      </div>
    `;
  }).join("");
}

function openSubject(index, fromHash = false) {
  const subject = classData[index];
  if (!subject) return;

  currentSubjectId = subject.id;
  hideAllPages();
  document.getElementById("subjectPage").classList.add("active");
  document.getElementById("subjectTitle").innerHTML = `${subject.icon} ${subject.title}`;
  document.getElementById("subjectDescription").textContent =
    `${subject.badge || "2027 A/L"} • Recordings & Resources`;

  renderRecordings(subject);

  if (!fromHash) history.replaceState(null, "", `#${subject.id}`);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function openSingleItem(subjectId, itemId, fromHash = false) {
  const subject = classData.find(s => s.id === subjectId);
  if (!subject) return;

  let item = null;
  subject.cards.forEach(card => {
    (card.items || []).forEach(i => { if (i.id === itemId) item = i; });
  });
  if (!item) return;

  currentSubjectId = subjectId;
  hideAllPages();
  document.getElementById("itemPage").classList.add("active");

  document.getElementById("itemPageTitle").textContent = item.title;
  document.getElementById("itemPageDesc").textContent = `${subject.icon} ${subject.title}`;

  const backBtn = document.getElementById("itemBackBtn");
  if (backBtn) {
    backBtn.onclick = () => {
      const idx = classData.findIndex(s => s.id === subjectId);
      if (idx !== -1) openSubject(idx);
    };
  }

  const progress = loadProgress();
  const isDone = !!progress[item.id];
  const accent = subject.color || "#3b82f6";

  const resourcesHtml = (item.links || []).map(link => {
    const cls = resourceClass(link.type);
    const icon = resourceIcon(link.type);
    const sub = resourceSubText(link.type);
    if (link.type === "pending") {
      return `
        <div class="resource ${cls}">
          <div class="resource-icon">${icon}</div>
          <div class="resource-text">
            <strong>${link.label}</strong>
            <span>${sub}</span>
          </div>
        </div>`;
    }
    return `
      <a class="resource ${cls}" href="${link.url}" target="_blank" rel="noopener noreferrer">
        <div class="resource-icon">${icon}</div>
        <div class="resource-text">
          <strong>${link.label}</strong>
          <span>${sub}</span>
        </div>
      </a>`;
  }).join("");

  document.getElementById("singleItemContent").innerHTML = `
    <div class="single-wrap">
      <div class="single-top ${isDone ? "completed" : ""}" style="--accent-color:${accent}">
        <div class="single-top-inner">
          <div class="single-num">${item.num || "•"}</div>
          <div class="single-meta">
            <h3>${item.title}</h3>
            <p>${subject.badge || "2027 A/L"}</p>
          </div>
        </div>
      </div>
      <div class="single-resources">
        ${resourcesHtml || `<div class="empty">No resources available.</div>`}
      </div>
    </div>
    <div class="single-check-row">
      <input type="checkbox" id="singleCheck" ${isDone ? "checked" : ""} 
             onchange="toggleProgress('${item.id}', this)">
      <label for="singleCheck">Mark as completed</label>
    </div>
  `;

  if (!fromHash) history.replaceState(null, "", `#${subjectId}/${itemId}`);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function goHome() {
  hideAllPages();
  document.getElementById("homePage").classList.add("active");
  currentSubjectId = null;
  history.replaceState(null, "", window.location.pathname + window.location.search);
  renderHome();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderRecordings(subject) {
  const container = document.getElementById("recordingList");
  const progress = loadProgress();
  let html = "";

  subject.cards.forEach(card => {
    if (!card.items?.length) return;
    card.items.forEach((item, index) => {
      const done = progress[item.id] ? "completed" : "";
      const resources = (item.links || []).map(link => {
        const cls = resourceClass(link.type);
        const icon = resourceIcon(link.type);
        const sub = resourceSubText(link.type);
        if (link.type === "pending") {
          return `
            <div class="resource ${cls}">
              <div class="resource-icon">${icon}</div>
              <div class="resource-text">
                <strong>${link.label}</strong>
                <span>${sub}</span>
              </div>
            </div>`;
        }
        return `
          <a class="resource ${cls}" href="${link.url}" target="_blank" rel="noopener noreferrer">
            <div class="resource-icon">${icon}</div>
            <div class="resource-text">
              <strong>${link.label}</strong>
              <span>${sub}</span>
            </div>
          </a>`;
      }).join("");

      html += `
        <div class="recording ${done}" data-id="${item.id}">
          <div class="recording-main" onclick="toggleRecording(this)">
            <div class="recording-number">${item.num || String(index + 1).padStart(2, "0")}</div>
            <div class="recording-info">
              <h3>${item.title}</h3>
              <p>${(item.links?.length) ? "Tap to view resources" : "No resources yet"}</p>
            </div>
            <div class="progress-row">
              <input type="checkbox" class="progress-check" ${done ? "checked" : ""}
                     onclick="event.stopPropagation()"
                     onchange="toggleProgress('${item.id}', this)">
              <span class="chevron">›</span>
            </div>
          </div>
          <div class="resources">
            ${resources || `<div class="empty">No resources available.</div>`}
          </div>
        </div>`;
    });
  });

  container.innerHTML = html || `<div class="empty">No recordings available.</div>`;
}

function toggleRecording(el) {
  el.closest(".recording").classList.toggle("open");
}

function toggleProgress(id, checkbox) {
  const progress = loadProgress();
  if (checkbox.checked) progress[id] = true;
  else delete progress[id];
  saveProgress(progress);

  const rec = document.querySelector(`.recording[data-id="${id}"]`);
  if (rec) {
    rec.classList.toggle("completed", checkbox.checked);
  }

  const singleTop = document.querySelector(".single-top");
  if (singleTop) {
    singleTop.classList.toggle("completed", checkbox.checked);
  }

  // Refresh home progress pills if needed
  if (document.getElementById("homePage").classList.contains("active")) {
    renderHome();
  }
}

function handleHash() {
  const hash = window.location.hash.slice(1);
  if (!hash || !classData) {
    goHome();
    return;
  }

  const [subjectId, itemId] = hash.split("/");
  const index = classData.findIndex(s => s.id === subjectId);

  if (index === -1) {
    goHome();
    return;
  }

  if (itemId) {
    openSingleItem(subjectId, itemId, true);
  } else {
    openSubject(index, true);
  }
}

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  html.setAttribute("data-theme", next === "dark" ? "dark" : "");
  localStorage.setItem(THEME_KEY, next);
  document.querySelector(".theme-btn").textContent = next === "dark" ? "☀️" : "🌙";
}

function initTheme() {
  const saved = localStorage.getItem(THEME_KEY) || "light";
  if (saved === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
    document.querySelector(".theme-btn").textContent = "☀️";
  }
}

document.addEventListener("DOMContentLoaded", () => {
  initTheme();
  if (typeof classData === "undefined") {
    document.getElementById("subjectGrid").innerHTML = `<div class="empty">data.js not loaded. Please check the file.</div>`;
    return;
  }
  renderHome();
  handleHash();
});
window.addEventListener("hashchange", handleHash);
</script>
</body>
</html>
